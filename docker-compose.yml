services:
    mongodb:
        image: mongo:8
        container_name: municipality-mongodb
        restart: unless-stopped
        ports:
            - "27017:27017"
        volumes:
            - mongodb_data:/data/db
        healthcheck:
            test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
            interval: 5s
            timeout: 5s
            retries: 10

    importer:
        build: .
        container_name: municipality-importer
        environment:
            - MONGO_HOST=mongodb
        depends_on:
            mongodb:
                condition: service_healthy

volumes:
    mongodb_data: